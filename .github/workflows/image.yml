name: Test and publish image

# Runs the tests, builds the Docker image, checks the built image on a sample
# label, then publishes it to GitHub's container registry as
# ghcr.io/<owner>/<repo>:latest (and :sha-<commit>). A host such as Azure
# Container Apps can run that image directly, with no registry of its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # rapidocr pulls in the desktop OpenCV build, which needs GUI libraries the
          # runner doesn't have. Use the headless build of the same version, as the Dockerfile does.
          version="$(pip show opencv-python | sed -n 's/^Version: //p')"
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps "opencv-python-headless==${version}"
      - name: Run tests
        run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: label-verifier:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image on a sample label
        run: |
          docker run -d --name app -p 8000:8000 -e OCR_THREADS=2 label-verifier:test
          trap 'docker logs app' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          # The sample label says 40% alcohol; this application says 45%, so the check must fail it.
          verdict="$(curl -sf \
            -F image=@app/static/samples/river-bend-vodka.png \
            -F 'application={"brand_name":"River Bend","alcohol_content":"45%"}' \
            http://127.0.0.1:8000/api/verify | jq -r .verdict)"
          echo "verdict: ${verdict}"
          test "${verdict}" = "fail"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
